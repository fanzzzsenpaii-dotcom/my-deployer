<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Neubrutalism Deployer</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-yellow: #ffde59;
            --bg-pink: #ff66c4;
            --bg-cyan: #5ce1e6;
            --bg-green: #7ed957;
            --bg-orange: #ff914d;
            --bg-whatsapp: #25d366;
            --card-bg: #ffffff;
            --dark: #000000;
            --border: 4px solid #000000;
            --shadow: 5px 5px 0px #000000;
            --shadow-active: 2px 2px 0px #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            font-weight: bold;
        }

        body {
            background-color: var(--bg-yellow);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(var(--dark) 10%, transparent 11%);
            background-size: 20px 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .card {
            background: var(--card-bg);
            border: var(--border);
            box-shadow: var(--shadow);
            padding: 25px;
            border-radius: 0px;
            position: relative;
        }

        .badge {
            display: inline-block;
            background: var(--bg-pink);
            border: var(--border);
            padding: 4px 10px;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        /* --- VIDEO INTRO STYLING --- */
        .video-container {
            position: relative;
            width: 100%;
            border: var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            background: #000;
            overflow: hidden;
        }

        .video-container video {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            display: block;
        }

        .video-sound-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--bg-yellow);
            border: 2px solid #000;
            padding: 5px 10px;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
            display: flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
            z-index: 10;
        }
        .video-sound-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px #000;
        }

        h1, h2 {
            text-transform: uppercase;
            margin-bottom: 15px;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        p {
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-size: 13px;
        }

        input[type="text"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 12px;
            border: var(--border);
            background: #fff;
            font-size: 13px;
            outline: none;
            box-shadow: var(--shadow);
            transition: all 0.1s ease;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: var(--border);
            background: #fff;
            box-shadow: var(--shadow);
            cursor: pointer;
        }

        input:focus, textarea:focus {
            background: #f0f0f0;
            box-shadow: 2px 2px 0px #000000;
            transform: translate(3px, 3px);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            font-family: monospace;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--bg-cyan);
            border: var(--border);
            box-shadow: var(--shadow);
            font-size: 15px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: all 0.1s ease;
            text-decoration: none;
            color: var(--dark);
        }

        .btn:hover { background: var(--bg-green); }
        .btn:active {
            box-shadow: var(--shadow-active);
            transform: translate(3px, 3px);
        }

        .btn-wa {
            background: var(--bg-whatsapp);
            margin-top: 15px;
        }
        .btn-wa:hover {
            background: #1eb855;
        }

        .divider {
            text-align: center;
            margin: 20px 0 15px 0;
            position: relative;
            font-size: 12px;
            text-transform: uppercase;
        }
        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: #000;
            z-index: 1;
        }
        .divider span {
            background: var(--card-bg);
            padding: 0 10px;
            position: relative;
            z-index: 2;
        }

        .alert {
            padding: 10px;
            border: var(--border);
            margin-bottom: 15px;
            display: none;
            font-size: 13px;
        }

        .alert-error { background: var(--bg-pink); }
        .alert-success { background: var(--bg-green); }

        .hidden { display: none !important; }

        .status-box {
            background: var(--bg-orange);
            border: var(--border);
            padding: 15px;
            margin-top: 20px;
            font-size: 12px;
            word-break: break-all;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: var(--border);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            border: var(--border);
            background: #fff;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
            box-shadow: 3px 3px 0px #000;
        }

        .tab-btn.active { background: var(--bg-yellow); }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ================= 1. HALAMAN LOGIN ADMIN ================= -->
        <div id="loginPage" class="card">
            <div class="badge">Akses Terbatas</div>

            <!-- INTRO VIDEO CONTAINER -->
            <div class="video-container">
                <video id="introVideo" autoplay loop muted playsinline>
                    <source src="https://ypggmvkgnjeflbkxooot.supabase.co/storage/v1/object/public/media/1788418737151_9d3clniauji.mp4" type="video/mp4">
                    Browser Anda tidak mendukung pemutar video.
                </video>
                <button type="button" class="video-sound-btn" id="toggleSoundBtn">
                    <i data-lucide="volume-x" id="soundIcon" style="width: 14px; height: 14px;"></i> 
                    <span id="soundText">Mute</span>
                </button>
            </div>

            <h1><i data-lucide="lock"></i> Login Admin</h1>
            <p>Masukkan Kode Akses Admin untuk membuka Layanan Vercel Deployer.</p>

            <div id="loginAlert" class="alert alert-error">
                <i data-lucide="alert-triangle" style="width:16px; height:16px; vertical-align:middle;"></i>
                <span id="loginAlertMsg">Kode admin salah!</span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="adminCode">Kode Admin</label>
                    <input type="password" id="adminCode" placeholder="Masukkan kode..." required autocomplete="off">
                </div>
                <button type="submit" class="btn" id="btnLogin">
                    <i data-lucide="key"></i> Masuk Ke Deployer
                </button>
            </form>

            <div class="divider">
                <span>Belum Punya Kode?</span>
            </div>

            <!-- Tombol Beli Kode via WA Admin -->
            <a href="https://wa.me/249114439118?text=BUY%20CODE%20ADMIN%20500P" target="_blank" class="btn btn-wa">
                <i data-lucide="message-circle"></i> Beli Kode Admin (500P)
            </a>
        </div>


        <!-- ================= 2. HALAMAN DEPLOY VERCEL ================= -->
        <div id="deployPage" class="card hidden">
            <div class="header-bar">
                <div class="badge" style="margin:0; background: var(--bg-green);">Akses Diterima</div>
                <button id="logoutBtn" style="background:none; border:none; cursor:pointer;" title="Keluar">
                    <i data-lucide="log-out"></i>
                </button>
            </div>

            <h2><i data-lucide="rocket"></i> Instant HTML Deployer</h2>
            <p>Deploy website HTML kamu secara publik dalam hitungan detik.</p>

            <div id="deployAlert" class="alert"></div>

            <form id="deployForm">
                <div class="form-group">
                    <label for="projectName">Nama Subdomain / Project</label>
                    <input type="text" id="projectName" placeholder="contoh: web-kece-saya" required>
                </div>

                <!-- TAB PILIHAN INPUT -->
                <label>Pilih Metode Input HTML:</label>
                <div class="tab-buttons">
                    <button type="button" class="tab-btn active" id="btnTabFile" onclick="switchTab('file')">
                        <i data-lucide="file" style="width:14px; height:14px;"></i> Upload File
                    </button>
                    <button type="button" class="tab-btn" id="btnTabText" onclick="switchTab('text')">
                        <i data-lucide="code" style="width:14px; height:14px;"></i> Text Code HTML
                    </button>
                </div>

                <!-- OPTION 1: FILE UPLOAD -->
                <div id="sectionFile" class="form-group">
                    <label for="htmlFile">Pilih File HTML</label>
                    <input type="file" id="htmlFile" accept=".html">
                </div>

                <!-- OPTION 2: DIRECT TEXT -->
                <div id="sectionText" class="form-group hidden">
                    <label for="htmlSource">Paste Kode HTML</label>
                    <textarea id="htmlSource" placeholder="<!DOCTYPE html>&#10;<html>&#10;<body>&#10;  <h1>Hello World</h1>&#10;</body>&#10;</html>"></textarea>
                </div>

                <button type="submit" class="btn" id="btnDeploy">
                    <i data-lucide="upload-cloud"></i> Deploy Web Sekarang
                </button>
            </form>

            <div id="statusBox" class="status-box hidden">
                <div style="margin-bottom: 5px; text-transform: uppercase;">
                    <i data-lucide="info" style="width: 14px; height: 14px; vertical-align: middle;"></i> Status Output:
                </div>
                <div id="statusText">Menunggu proses...</div>
            </div>
        </div>

    </div>

    <script>
        // --- ELEMENTS ---
        const loginPage = document.getElementById('loginPage');
        const deployPage = document.getElementById('deployPage');
        const loginForm = document.getElementById('loginForm');
        const adminCodeInput = document.getElementById('adminCode');
        const loginAlert = document.getElementById('loginAlert');
        const loginAlertMsg = document.getElementById('loginAlertMsg');
        const btnLogin = document.getElementById('btnLogin');
        
        const deployForm = document.getElementById('deployForm');
        const deployAlert = document.getElementById('deployAlert');
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');
        const logoutBtn = document.getElementById('logoutBtn');
        const btnDeploy = document.getElementById('btnDeploy');

        const sectionFile = document.getElementById('sectionFile');
        const sectionText = document.getElementById('sectionText');
        const btnTabFile = document.getElementById('btnTabFile');
        const btnTabText = document.getElementById('btnTabText');

        // Video Audio Controls
        const introVideo = document.getElementById('introVideo');
        const toggleSoundBtn = document.getElementById('toggleSoundBtn');
        const soundIcon = document.getElementById('soundIcon');
        const soundText = document.getElementById('soundText');

        let savedAdminCode = localStorage.getItem('savedAdminCode') || "";
        let activeTab = 'file';

        lucide.createIcons();

        // Cek jika user sudah pernah login sebelumnya
        if (savedAdminCode) {
            showDeployPage();
        }

        // --- MUTE / UNMUTE VIDEO CONTROL ---
        toggleSoundBtn.addEventListener('click', () => {
            if (introVideo.muted) {
                introVideo.muted = false;
                soundText.textContent = "Unmute";
                soundIcon.setAttribute('data-lucide', 'volume-2');
            } else {
                introVideo.muted = true;
                soundText.textContent = "Mute";
                soundIcon.setAttribute('data-lucide', 'volume-x');
            }
            lucide.createIcons();
        });

        // --- SUBMIT LOGIN FORM ---
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const inputCode = adminCodeInput.value.trim();

            if (!inputCode) return;

            btnLogin.disabled = true;
            btnLogin.style.opacity = '0.7';
            btnLogin.innerHTML = `<i data-lucide="loader"></i> Memeriksa Kode...`;
            lucide.createIcons();

            // Tes verifikasi kode ke backend
            try {
                const res = await fetch('/api/deploy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminCode: inputCode, checkOnly: true })
                });

                const data = await res.json();

                // Jika server merespon "Kode Admin Salah"
                if (res.status === 401) {
                    loginAlertMsg.textContent = data.error || "Kode Admin Salah!";
                    loginAlert.style.display = 'block';
                } else {
                    // Kode Benar
                    savedAdminCode = inputCode;
                    localStorage.setItem('savedAdminCode', inputCode);
                    loginAlert.style.display = 'none';
                    showDeployPage();
                }
            } catch (err) {
                // Jika error lain, simpan kode dulu nanti dicek saat deploy
                savedAdminCode = inputCode;
                localStorage.setItem('savedAdminCode', inputCode);
                showDeployPage();
            } finally {
                btnLogin.disabled = false;
                btnLogin.style.opacity = '1';
                btnLogin.innerHTML = `<i data-lucide="key"></i> Masuk Ke Deployer`;
                lucide.createIcons();
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('savedAdminCode');
            savedAdminCode = "";
            deployPage.classList.add('hidden');
            loginPage.classList.remove('hidden');
            adminCodeInput.value = '';
        });

        function showDeployPage() {
            loginPage.classList.add('hidden');
            deployPage.classList.remove('hidden');
        }

        function switchTab(type) {
            activeTab = type;
            if (type === 'file') {
                sectionFile.classList.remove('hidden');
                sectionText.classList.add('hidden');
                btnTabFile.classList.add('active');
                btnTabText.classList.remove('active');
            } else {
                sectionText.classList.remove('hidden');
                sectionFile.classList.add('hidden');
                btnTabText.classList.add('active');
                btnTabFile.classList.remove('active');
            }
        }

        // --- SUBMIT DEPLOY FORM ---
        deployForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const projectName = document.getElementById('projectName').value.trim();
            let htmlContent = "";

            if (activeTab === 'file') {
                const fileInput = document.getElementById('htmlFile');
                if (!fileInput.files || fileInput.files.length === 0) {
                    showAlert(deployAlert, "Pilih berkas file HTML!", "error");
                    return;
                }
                htmlContent = await fileInput.files[0].text();
            } else {
                htmlContent = document.getElementById('htmlSource').value;
                if (!htmlContent.trim()) {
                    showAlert(deployAlert, "Isi kode HTML tidak boleh kosong!", "error");
                    return;
                }
            }

            btnDeploy.disabled = true;
            btnDeploy.style.opacity = '0.7';
            btnDeploy.innerHTML = `<i data-lucide="loader"></i> Memproses Deploy...`;
            lucide.createIcons();

            statusBox.classList.remove('hidden');
            statusText.textContent = "Mengirim data ke server Vercel...";

            try {
                const response = await fetch('/api/deploy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        adminCode: savedAdminCode, 
                        projectName, 
                        htmlContent 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert(deployAlert, "Deploy Berhasil!", "success");
                    statusText.innerHTML = `
                        <strong>SUKSES DEPLOY! 🎉</strong><br><br>
                        <b>URL Website Anda:</b><br>
                        <a href="https://${data.url}" target="_blank" style="color:#000; font-size:14px; text-decoration:underline;">https://${data.url}</a>
                    `;
                } else {
                    if (response.status === 401) {
                        // Jika ternyata kodenya salah/kadaluarsa
                        localStorage.removeItem('savedAdminCode');
                        alert("Sesi login berakhir atau Kode Admin Salah!");
                        location.reload();
                        return;
                    }
                    showAlert(deployAlert, "Gagal Deploy!", "error");
                    statusText.innerHTML = `<strong>ERROR:</strong> ${data.error || 'Terjadi kesalahan'}`;
                }
            } catch (err) {
                showAlert(deployAlert, "Terjadi kesalahan jaringan.", "error");
                statusText.innerHTML = `<strong>ERROR KONEKSI:</strong> ${err.message}`;
            } finally {
                btnDeploy.disabled = false;
                btnDeploy.style.opacity = '1';
                btnDeploy.innerHTML = `<i data-lucide="upload-cloud"></i> Deploy Web Sekarang`;
                lucide.createIcons();
            }
        });

        function showAlert(element, message, type) {
            element.className = `alert alert-${type === 'success' ? 'success' : 'error'}`;
            element.style.display = 'block';
            element.textContent = message;
        }
    </script>
</body>
</html>
